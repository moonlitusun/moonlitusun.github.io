<style>
/* Shared Media Styles for /mine/books/ and /mine/movies/ */
/* These styles override the default Gokarna layout for an immersive visual experience */

/* Adjust container width for better reading experience */
.post.container {
  width: 100% !important;
  max-width: 1400px !important;
  display: block !important;
  margin: 0 auto !important;
  overflow: visible !important;
}

body, html, main#content, main#content > .container {
  overflow: visible !important;
}

.post-content {
  width: 100% !important;
  max-width: 100% !important;
}

/* Beautiful Horizontal Sticky TOC */
.post-toc {
  width: 100% !important;
  padding-left: 0 !important;
  display: block !important;
  margin-bottom: 2rem;
  /* Instead of sticky, we'll try something else or ensure max-height works so it never overlaps too much */
}

#toc {
  position: static !important; /* The sticky top was causing height/overlap bugs with the fixed header */
  width: 100% !important;
  padding: 1.2rem 1.5rem !important;
  background: rgba(255, 255, 255, 0.85) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05) !important;
  border: 1px solid rgba(0,0,0,0.05);
  margin-bottom: 2rem !important;
  /* Fix height and scrolling */
  max-height: none !important;
  overflow: visible !important;
}

html[data-theme='dark'] #toc,
body.dark-theme #toc,
body.dark #toc {
  background: rgba(26, 27, 38, 0.85) !important;
  border-color: rgba(255,255,255,0.05);
}

#toc::before {
  display: none !important; /* Hide "目录" text */
}

#toc ul {
  display: flex !important;
  flex-wrap: wrap !important; /* Wrap instead of scroll so we can see all options at once without a tiny scrollbar! */
  gap: 12px;
  margin: 0;
  padding: 0 !important; 
}

#toc ul li {
  margin: 0 !important;
  flex-shrink: 0;
}

#toc ul li a {
  display: block;
  padding: 0.6rem 1.2rem !important;
  color: var(--text-color, #444) !important;
  background: var(--card-bg, #f8f9fa);
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.3s ease;
  font-size: 0.95rem;
  font-weight: 600;
  border: 1px solid rgba(0,0,0,0.05);
}

#toc ul li a::before {
  display: none !important;
}

#toc ul li a:hover,
#toc ul li a.active {
  background: linear-gradient(120deg, var(--accent-color, #8a2be2), #ab47bc) !important;
  color: #fff !important;
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(138, 43, 226, 0.3);
  border-color: transparent;
}

html[data-theme='dark'] #toc ul li a,
body.dark-theme #toc ul li a,
body.dark #toc ul li a {
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.9) !important;
  border-color: rgba(255,255,255,0.1);
}

html[data-theme='dark'] #toc ul li a:hover,
html[data-theme='dark'] #toc ul li a.active,
body.dark-theme #toc ul li a:hover,
body.dark-theme #toc ul li a.active,
body.dark #toc ul li a:hover,
body.dark #toc ul li a.active {
  background: linear-gradient(120deg, var(--accent-color, #8a2be2), #ab47bc) !important;
  color: #fff !important;
}

/* Year Titles */
.year-group {
  margin-bottom: 4rem;
  scroll-margin-top: 100px;
}

.year-title {
  font-size: 2.5rem;
  font-weight: 800;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid rgba(0,0,0,0.05);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.year-title span {
  background: linear-gradient(120deg, var(--accent-color, #8a2be2), #ab47bc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.year-count {
  font-size: 1rem;
  padding: 0.4rem 1rem;
  background: rgba(138, 43, 226, 0.1);
  color: var(--accent-color, #8a2be2);
  border-radius: 20px;
  font-weight: 600;
  -webkit-text-fill-color: initial;
}

/* Grid Layout */
.items-grid, .books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 2rem;
}

/* Card Styling */
.item-card, .book-card {
  background: var(--card-bg, #ffffff);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 1px solid rgba(0,0,0,0.03);
}

.item-card:hover, .book-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.item-card:hover::after, .book-card:hover::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 16px;
  border: 2px solid var(--accent-color, #8a2be2);
  opacity: 0.5;
  pointer-events: none;
}

/* Cover Styling */
.item-cover-wrapper, .book-cover-wrapper {
  position: relative;
  width: 100%;
  padding-top: 140%; /* 1:1.4 aspect ratio */
  overflow: hidden;
}

.item-cover, .book-cover {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.item-card:hover .item-cover, .book-card:hover .book-cover {
  transform: scale(1.05) rotate(1deg);
}

.item-cover-placeholder, .book-cover-placeholder {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1rem;
  font-weight: bold;
  text-align: center;
}

/* Item Meta/Content Styling */
.item-info, .book-info {
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.item-title, .book-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-top: 4rem;
  color: var(--text-color, #333);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.item-meta, .book-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  font-size: 0.6rem;
  color: #666;
}

.item-rating, .book-rating {
  color: #f39c12;
  font-weight: bold;
  background: rgba(243, 156, 18, 0.1);
  padding: 4px 8px;
  border-radius: 12px;
}

.item-author, .book-author {
  font-weight: 500;
  opacity: 0.8;
}

.cinema-badge {
  background: rgba(46, 204, 113, 0.1);
  color: #27ae60;
  padding: 4px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 0.85rem;
}

.item-date {
  font-size: 0.85rem;
  opacity: 0.7;
}

/* Dark Mode Overrides */
html[data-theme='dark'] .item-card, html[data-theme='dark'] .book-card,
body.dark-theme .item-card, body.dark-theme .book-card,
body.dark .item-card, body.dark .book-card {
  background: #1e1e2e;
  border-color: rgba(255,255,255,0.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

html[data-theme='dark'] .item-title, html[data-theme='dark'] .book-title,
body.dark-theme .item-title, body.dark-theme .book-title,
body.dark .item-title, body.dark .book-title {
  color: #f8f8f2;
}

html[data-theme='dark'] .item-meta, html[data-theme='dark'] .book-meta,
body.dark-theme .item-meta, body.dark-theme .book-meta,
body.dark .item-meta, body.dark .book-meta {
  color: #a6accd;
}

html[data-theme='dark'] .year-title,
body.dark-theme .year-title,
body.dark .year-title {
  border-bottom-color: rgba(255,255,255,0.1);
}

/* Responsive */
@media (max-width: 768px) {
  .items-grid, .books-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1.5rem;
  }
  
  .year-title {
    font-size: 2rem;
  }
}
</style>
